# pfSense Open UI Configuration
# Edit this file to customize the UI appearance, layout, and navigation.
# Changes require a page reload to take effect.

[theme]
# Color scheme: default-teal, dracula, catppuccin-mocha, catppuccin-latte,
# tokyo-night, nord, gruvbox-dark, solarized-dark, one-dark-pro, github-dark
scheme = "default-teal"
# Theme mode: light, dark, or auto (follows system preference)
mode = "auto"

[layout]
# Layout preset: enterprise (dense), relaxed (spacious), or custom
preset = "relaxed"
# Custom settings (only used when preset = "custom")
# sidebarWidth = 260
# density = "comfortable"
# fontScale = 1.0

[menu]
# Reorder sidebar items by listing their IDs in desired order
# Available: dashboard, firewall, nat, interfaces, vpn, services, system, monitoring
# order = ["dashboard", "firewall", "interfaces", "vpn", "services", "system", "monitoring"]

# Hide sections you don't use
# hidden = ["nat"]

# Pin favorite pages to quick-access area at top of sidebar
# Example: pin DHCP management pages for quick access
# favorites = ["dashboard", "firewall"]

# Override menu labels
# [menu.customLabels]
# monitoring = "Traffic & Logs"

# Override menu icons (MUI icon names)
# [menu.customIcons]
# monitoring = "Analytics"

# Pin specific sub-pages directly to the sidebar
# [[menu.customItems]]
# id = "dhcp-static-mappings"
# label = "Static Maps"  # optional override
#
# [[menu.customItems]]
# id = "terminal"
#
# Available page IDs: dhcp-static-mappings, dhcp-leases, terminal,
# dns-host-overrides, vpn-openvpn, vpn-wireguard, monitoring-logs, etc.

[dashboard]
# Configure dashboard widget visibility and order
# [[dashboard.widgets]]
# id = "system-stats"
# visible = true
# order = 1

# [[dashboard.widgets]]
# id = "gateways"
# visible = true
# order = 2

# Custom Widgets
# Define custom dashboard widgets using config-driven or template-based approach.
#
# Config-driven example:
# [[dashboard.customWidgets]]
# type = "config"
# id = "my-cpu-gauge"
# title = "My CPU Gauge"
# dataSource = "system-cpu"
# displayType = "gauge"
# refreshInterval = 10
#
# Template-based example:
# [[dashboard.customWidgets]]
# type = "template"
# id = "my-custom-widget"
# title = "Custom Widget"
# template = "<div>{{data.cpu_usage}}% CPU</div>"
# apiEndpoints = ["/status/system"]

[defaults]
# Page to show after login
landingPage = "/dashboard"