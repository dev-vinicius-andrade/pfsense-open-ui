name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (demo mode for Pages)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run build
        env:
          VITE_DEMO_MODE: 'true'

      - name: Build (standard)
        if: "!(github.ref == 'refs/heads/main' && github.event_name == 'push')"
        run: npm run build

      - name: Copy 404.html for SPA routing
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cp dist/index.html dist/404.html

      - name: Verify 404.html exists
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          test -f dist/404.html || (echo "ERROR: dist/404.html missing!" && exit 1)
          echo "404.html size: $(wc -c < dist/404.html) bytes"
          echo "index.html size: $(wc -c < dist/index.html) bytes"

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4